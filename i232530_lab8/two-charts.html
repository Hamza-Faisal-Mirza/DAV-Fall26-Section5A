
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Penguin Charts</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        svg {
            display: block;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<h2>Body Mass by Species</h2>
<svg id="speciesChart" width="700" height="350"></svg>

<h2>Number of Penguins per Island</h2>
<svg id="islandChart" width="700" height="350"></svg>

<script>
d3.csv("dataset/penguins.csv", d3.autoType).then(data => {

    data = data.filter(d =>
        d.species && d.island &&
        Number.isFinite(d.body_mass_g)
    );

    drawChart(
        "#speciesChart",
        Array.from(
            d3.rollup(
                data,
                v => d3.mean(v, d => d.body_mass_g),
                d => d.species
            ),
            ([name, value]) => ({name, value})
        ),
        "Average Body Mass (g)"
    );

    drawChart(
        "#islandChart",
        Array.from(
            d3.rollup(
                data,
                v => v.length,
                d => d.island
            ),
            ([name, value]) => ({name, value})
        ),
        "Number of Penguins"
    );

    function drawChart(selector, chartData, label) {
        const width = 700;
        const height = 350;
        const margin = {top: 20, right: 20, bottom: 60, left: 80};

        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const svg = d3.select(selector)
            .append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        const x = d3.scaleBand()
            .domain(chartData.map(d => d.name))
            .range([0, innerWidth])
            .padding(0.25);

        const y = d3.scaleLinear()
            .domain([0, d3.max(chartData, d => d.value)])
            .nice()
            .range([innerHeight, 0]);

        svg.append("g")
            .attr("transform", `translate(0,${innerHeight})`)
            .call(d3.axisBottom(x));

        svg.append("g")
            .call(d3.axisLeft(y));

        svg.selectAll("rect")
            .data(chartData)
            .join("rect")
            .attr("x", d => x(d.name))
            .attr("y", d => y(d.value))
            .attr("width", x.bandwidth())
            .attr("height", d => innerHeight - y(d.value))
            .attr("fill", "steelblue");

        svg.append("text")
            .attr("x", innerWidth / 2)
            .attr("y", innerHeight + 45)
            .attr("text-anchor", "middle")
            .text("Category");

        svg.append("text")
            .attr("transform", "rotate(-90)")
            .attr("x", -innerHeight / 2)
            .attr("y", -55)
            .attr("text-anchor", "middle")
            .text(label);
    }
}).catch(error => console.error(error));
</script>

</body>
</html>
