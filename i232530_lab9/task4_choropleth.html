<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 4 - World Population Choropleth</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .country { stroke: #fff; stroke-width: .5px; }
  .tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,.85); color: #fff;
             padding: 6px 10px; border-radius: 4px; font-size: 13px; opacity: 0; }
</style>
</head>
<body>
<h2>World Population by Country (millions)</h2>
<p>Countries in light gray have no data in population.csv.</p>
<div id="chart"></div>
<div class="tooltip" id="tip"></div>
<script>
const width = 960, height = 540;
const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
const tip = d3.select("#tip");

Promise.all([
  d3.json("dataset/world.geojson"),
  d3.csv("dataset/population.csv", d3.autoType)
]).then(([world, pop]) => {
  // join key: id (ISO-3 code) -> row
  const popById = new Map(pop.map(d => [d.id, d]));
  const maxPop = d3.max(pop, d => d.population_millions);

  const projection = d3.geoNaturalEarth1().fitSize([width, height - 50], world);
  const path = d3.geoPath(projection);

  const color = d3.scaleSequentialSqrt(d3.interpolateYlOrRd).domain([0, maxPop]);

  svg.append("g").selectAll("path").data(world.features).join("path")
    .attr("class", "country")
    .attr("d", path)
    .attr("fill", d => popById.has(d.id) ? color(popById.get(d.id).population_millions) : "#e0e0e0")
    .on("mouseover", function () { d3.select(this).raise().attr("stroke", "#000").attr("stroke-width", 1.8); })
    .on("mousemove", (event, d) => {
      const row = popById.get(d.id);
      tip.style("opacity", 1).style("left", event.pageX + 12 + "px").style("top", event.pageY + 12 + "px")
         .html(`<b>${d.properties.name}</b><br>${row ? row.population_millions + " million" : "No data"}`);
    })
    .on("mouseout", function () { d3.select(this).attr("stroke", "#fff").attr("stroke-width", .5); tip.style("opacity", 0); });

  // legend: gradient bar with min / max labels
  const lw = 260, lh = 12, lx = 20, ly = height - 30;
  const defs = svg.append("defs");
  const grad = defs.append("linearGradient").attr("id", "grad");
  d3.range(0, 1.01, 0.1).forEach(t => {
    // sample the sqrt scale so the gradient matches the map colors
    grad.append("stop").attr("offset", t * 100 + "%").attr("stop-color", color(maxPop * t * t));
  });
  svg.append("rect").attr("x", lx).attr("y", ly).attr("width", lw).attr("height", lh).attr("fill", "url(#grad)").attr("stroke", "#999");
  svg.append("text").attr("x", lx).attr("y", ly - 5).attr("font-size", 12).text("Population (millions)");
  svg.append("text").attr("x", lx).attr("y", ly + lh + 14).attr("font-size", 12).text("0 (min)");
  svg.append("text").attr("x", lx + lw).attr("y", ly + lh + 14).attr("font-size", 12).attr("text-anchor", "end").text(maxPop + " (max)");
});
</script>
</body>
</html>
