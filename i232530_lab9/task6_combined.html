<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 6 - Combined Spatial Encoding Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,.85); color: #fff;
             padding: 6px 10px; border-radius: 4px; font-size: 13px; opacity: 0; }
  .label { font-size: 12px; font-weight: bold; pointer-events: none; }
  .legend text { font-size: 12px; }
</style>
</head>
<body>
<h2>Pakistan: Cities and Flight Routes</h2>
<div id="chart"></div>
<div class="tooltip" id="tip"></div>
<script>
const width = 760, height = 700;
const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
const tip = d3.select("#tip");

Promise.all([
  d3.json("dataset/world.geojson"),
  d3.csv("dataset/pakistan_cities.csv", d3.autoType),
  d3.csv("dataset/flights.csv", d3.autoType)
]).then(([world, cities, flights]) => {
  const pakistan = world.features.find(f => f.id === "PAK");
  const projection = d3.geoMercator().fitExtent([[40, 40], [width - 40, height - 40]], pakistan);
  const path = d3.geoPath(projection);

  // lookup + degree (routes per city)
  const cityByName = new Map(cities.map(c => [c.name, c]));
  cities.forEach(c => c.degree = flights.filter(f => f.source === c.name || f.target === c.name).length);
  cities.forEach(c => c.hub = c.degree >= 4);
  const pos = c => projection([c.lon, c.lat]);

  const r = d3.scaleSqrt().domain([0, d3.max(cities, d => d.pop)]).range([3, 35]);
  const w = d3.scaleLinear().domain(d3.extent(flights, d => d.flights)).range([1, 8]);
  const hubColor = "#d62728", normalColor = "#1f77b4";

  // map background
  svg.append("g").selectAll("path").data(world.features).join("path")
    .attr("d", path).attr("fill", d => d.id === "PAK" ? "#eef3ea" : "#f4f4f4").attr("stroke", "#aaa");

  // 1) routes FIRST (drawn below the cities)
  const routes = svg.append("g").selectAll("line").data(flights).join("line")
    .attr("x1", d => pos(cityByName.get(d.source))[0]).attr("y1", d => pos(cityByName.get(d.source))[1])
    .attr("x2", d => pos(cityByName.get(d.target))[0]).attr("y2", d => pos(cityByName.get(d.target))[1])
    .attr("stroke", "#555").attr("stroke-opacity", .5).attr("stroke-width", d => w(d.flights))
    .attr("stroke-linecap", "round");

  // 2) cities on top
  const dots = svg.append("g").selectAll("circle").data(cities).join("circle")
    .attr("cx", d => pos(d)[0]).attr("cy", d => pos(d)[1]).attr("r", d => r(d.pop))
    .attr("fill", d => d.hub ? hubColor : normalColor).attr("fill-opacity", .65)
    .attr("stroke", "#fff").attr("stroke-width", 1.2);

  svg.append("g").selectAll("text").data(cities).join("text").attr("class", "label")
    .attr("x", d => pos(d)[0] + r(d.pop) + 4).attr("y", d => pos(d)[1] + 4).text(d => d.name)
    .style("pointer-events", "none");

  // hover: highlight routes of the city, dim everything else
  dots.on("mouseover", (event, d) => {
      const touches = f => f.source === d.name || f.target === d.name;
      const linked = new Set([d.name]);
      flights.filter(touches).forEach(f => { linked.add(f.source); linked.add(f.target); });
      routes.attr("stroke-opacity", f => touches(f) ? .95 : .05).attr("stroke", f => touches(f) ? "#000" : "#555");
      dots.attr("fill-opacity", c => linked.has(c.name) ? .85 : .12);
      tip.style("opacity", 1).html(`<b>${d.name}</b><br>Population: ${d.pop} million<br>Routes: ${d.degree}${d.hub ? " (hub)" : ""}`);
    })
    .on("mousemove", e => tip.style("left", e.pageX + 12 + "px").style("top", e.pageY + 12 + "px"))
    .on("mouseout", () => {
      routes.attr("stroke-opacity", .5).attr("stroke", "#555");
      dots.attr("fill-opacity", .65);
      tip.style("opacity", 0);
    });

  // legend explaining all four encodings
  const lg = svg.append("g").attr("class", "legend").attr("transform", "translate(20,20)");
  lg.append("rect").attr("x", -10).attr("y", -10).attr("width", 215).attr("height", 215).attr("fill", "#fff").attr("opacity", .9).attr("stroke", "#ccc");
  lg.append("text").attr("font-weight", "bold").text("Encodings");
  lg.append("text").attr("y", 18).text("Position = city location");
  lg.append("text").attr("y", 40).text("Circle size = population:");
  [1, 8, 16].forEach((p, i) => {
    const cx = 15 + i * 55;
    lg.append("circle").attr("cx", cx).attr("cy", 70).attr("r", r(p)).attr("fill", "#999").attr("fill-opacity", .5).attr("stroke", "#666");
    lg.append("text").attr("x", cx).attr("y", 112).attr("text-anchor", "middle").text(p + "M");
  });
  lg.append("text").attr("y", 130).text("Color = routes:");
  lg.append("circle").attr("cx", 10).attr("cy", 145).attr("r", 6).attr("fill", hubColor);
  lg.append("text").attr("x", 22).attr("y", 149).text("Hub (4+ routes)");
  lg.append("circle").attr("cx", 130).attr("cy", 145).attr("r", 6).attr("fill", normalColor);
  lg.append("text").attr("x", 142).attr("y", 149).text("Other");
  lg.append("text").attr("y", 172).text("Line width = flights / week:");
  [10, 40, 70].forEach((f, i) => {
    const x = i * 65;
    lg.append("line").attr("x1", x).attr("x2", x + 30).attr("y1", 188).attr("y2", 188).attr("stroke", "#555").attr("stroke-width", w(f)).attr("stroke-linecap", "round");
    lg.append("text").attr("x", x + 15).attr("y", 205).attr("text-anchor", "middle").text(f);
  });
});
</script>
</body>
</html>
