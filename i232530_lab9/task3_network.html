<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 3 - Flight Route Network</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: grab; }
  .node text { font-size: 12px; pointer-events: none; }
  .tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,.85); color: #fff;
             padding: 6px 10px; border-radius: 4px; font-size: 13px; opacity: 0; }
</style>
</head>
<body>
<h2>Pakistan Flight Route Network</h2>
<p>Link width = flights per week &nbsp;|&nbsp; Node size = number of routes (degree) &nbsp;|&nbsp; Drag nodes; hover to highlight.</p>
<div id="chart"></div>
<div class="tooltip" id="tip"></div>
<script>
const width = 900, height = 600;
const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
const tip = d3.select("#tip");

d3.csv("dataset/flights.csv", d3.autoType).then(links => {
  // edge list -> node list (Set removes duplicates)
  const names = new Set(links.flatMap(d => [d.source, d.target]));
  const nodes = Array.from(names, id => ({
    id,
    degree: links.filter(l => l.source === id || l.target === id).length
  }));

  const wScale = d3.scaleLinear().domain(d3.extent(links, d => d.flights)).range([1, 10]);
  const rScale = d3.scaleSqrt().domain([0, d3.max(nodes, d => d.degree)]).range([6, 28]);
  const color = d3.scaleSequential(d3.interpolateBlues).domain([0, d3.max(nodes, d => d.degree) + 2]);

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(130))
    .force("charge", d3.forceManyBody().strength(-400))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide(d => rScale(d.degree) + 6));

  const link = svg.append("g").attr("stroke", "#888").attr("stroke-opacity", .6)
    .selectAll("line").data(links).join("line")
      .attr("stroke-width", d => wScale(d.flights))
      .on("mousemove", (event, d) => {
        tip.style("opacity", 1).style("left", event.pageX + 12 + "px").style("top", event.pageY + 12 + "px")
           .html(`${d.source.id} ↔ ${d.target.id}<br>${d.flights} flights/week`);
      })
      .on("mouseleave", () => tip.style("opacity", 0));

  const node = svg.append("g").selectAll("g").data(nodes).join("g").attr("class", "node")
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end",   (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append("circle").attr("r", d => rScale(d.degree)).attr("fill", d => color(d.degree + 1));
  node.append("text").attr("text-anchor", "middle")
      .attr("dy", d => -rScale(d.degree) - 4).text(d => d.id);

  // hover: highlight connected routes, fade the rest
  node.on("mouseover", (event, d) => {
      const connected = new Set([d.id]);
      links.forEach(l => { if (l.source.id === d.id) connected.add(l.target.id); if (l.target.id === d.id) connected.add(l.source.id); });
      link.attr("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.05)
          .attr("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "#d62728" : "#888");
      node.style("opacity", n => connected.has(n.id) ? 1 : 0.15);
      tip.style("opacity", 1).html(`<b>${d.id}</b><br>${d.degree} routes`);
    })
    .on("mousemove", event => tip.style("left", event.pageX + 12 + "px").style("top", event.pageY + 12 + "px"))
    .on("mouseout", () => {
      link.attr("stroke-opacity", .6).attr("stroke", "#888");
      node.style("opacity", 1);
      tip.style("opacity", 0);
    });

  sim.on("tick", () => {
    nodes.forEach(d => { // keep inside the svg
      d.x = Math.max(30, Math.min(width - 30, d.x));
      d.y = Math.max(30, Math.min(height - 30, d.y));
    });
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });
});
</script>
</body>
</html>
